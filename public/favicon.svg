<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#14224A" />
    </linearGradient>

    <!-- Turquoise Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0D0" />
      <stop offset="100%" stop-color="#00B89C" />
    </linearGradient>

    <!-- Droplet Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00D2B4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- High-contrast rounded square tile for maximum visibility in dark & light tabs -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Signature Yes Dhobi Washing Circle with Inner Cutout -->
  <circle cx="32" cy="33" r="19" fill="none" stroke="url(#waveGrad)" stroke-width="7" />

  <!-- Dynamic laundry wave fill inside the lower half of the circle -->
  <path d="M 17 35 Q 24 40, 32 35 T 47 35 A 15.5 15.5 0 0 1 17 35 Z" fill="url(#waveGrad)" opacity="0.95" />

  <!-- Signature water droplet at top right of the badge -->
  <path d="M 45 13 C 41 18, 38 21.5, 38 24 A 4.5 4.5 0 0 0 47 24 C 47 21.5, 44 18, 45 13 Z" fill="#FFD600" />
  
  <!-- Bubble sparkle highlights -->
  <circle cx="26" cy="28" r="2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="38" cy="38" r="1.5" fill="#FFFFFF" opacity="0.7" />
</svg>
